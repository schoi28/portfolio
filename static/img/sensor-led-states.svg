<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="인터페이스 박스 상태 LED의 색상별 의미">
<rect width="560" height="250" fill="#f5f7f8"/>
<text x="30" y="34" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#6b7681">인터페이스 박스 전면 상태 LED</text>
<circle cx="48" cy="70" r="11" fill="#ffffff" stroke="#b9c0c8" stroke-width="1.5"/>
<text x="76" y="68" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0f1419">흰색 깜박임</text>
<text x="76" y="84" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6b7681">부팅 중 · 링크 대기</text>
<circle cx="48" cy="116" r="11" fill="#2f8f6b" stroke="#1d6b4f" stroke-width="1.5"/>
<text x="76" y="114" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0f1419">초록색 켜짐</text>
<text x="76" y="130" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6b7681">정상 · 전 센서 인식됨</text>
<circle cx="48" cy="162" r="11" fill="#d9892a" stroke="#9c5f14" stroke-width="1.5"/>
<text x="76" y="160" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0f1419">주황색 깜박임</text>
<text x="76" y="176" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6b7681">일부 센서 미인식 · 시간 동기화 실패</text>
<circle cx="48" cy="208" r="11" fill="#c0453f" stroke="#8a2f2a" stroke-width="1.5"/>
<text x="76" y="206" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0f1419">빨간색 켜짐</text>
<text x="76" y="222" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6b7681">전원 이상 · 하드웨어 고장</text>
<rect x="352" y="52" width="180" height="176" fill="#ffffff" stroke="#dfe3e8"/>
<text x="442" y="80" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6b7681" text-anchor="middle">LED가 꺼져 있다면</text>
<text x="442" y="106" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0f1419" text-anchor="middle">전원이 공급되지 않는 상태입니다</text>
<text x="442" y="134" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0f1419" text-anchor="middle">퓨즈와 커넥터 체결을</text>
<text x="442" y="152" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0f1419" text-anchor="middle">먼저 확인하십시오</text>
<text x="442" y="188" font-family="'Pretendard', -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#9b3a34" text-anchor="middle">점검 전 반드시 전원을 차단하십시오</text>
</svg>
