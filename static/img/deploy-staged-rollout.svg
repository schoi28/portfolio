<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" width="760" height="216"
     role="img"
     aria-label="배포 범위를 1퍼센트에서 100퍼센트까지 단계적으로 넓히는 과정">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="760" height="216" fill="#f5f7f8"/>
  <rect x="24" y="24" width="148" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="98" y="61" text-anchor="middle">1% 배포</text>
  <path d="M172 56H306" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="202" y="47" width="74" height="18" fill="#f5f7f8"/>
  <text class="t note" x="239" y="60" text-anchor="middle">결과 확인</text>
  <rect x="306" y="24" width="148" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="380" y="61" text-anchor="middle">10% 배포</text>
  <path d="M454 56H588" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="484" y="47" width="74" height="18" fill="#f5f7f8"/>
  <text class="t note" x="521" y="60" text-anchor="middle">결과 확인</text>
  <rect x="588" y="24" width="148" height="64" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="662" y="61" text-anchor="middle">100% 배포</text>
  <path d="M98 88V136" stroke="#9b3a34" stroke-width="2" marker-end="url(#arrow-danger)" fill="none" stroke-dasharray="6 4"/>
  <rect x="61" y="103" width="74" height="18" fill="#f5f7f8"/>
  <text class="t warn" x="98" y="116" text-anchor="middle">기준 미달</text>
  <rect x="24" y="136" width="148" height="56" fill="#ffffff" stroke="#9b3a34" stroke-width="2"/>
  <text class="t title" x="98" y="169" text-anchor="middle">일시 중지 · 롤백</text>
  <path d="M380 88V136" stroke="#9b3a34" stroke-width="2" marker-end="url(#arrow-danger)" fill="none" stroke-dasharray="6 4"/>
  <rect x="343" y="103" width="74" height="18" fill="#f5f7f8"/>
  <text class="t warn" x="380" y="116" text-anchor="middle">기준 미달</text>
  <rect x="306" y="136" width="148" height="56" fill="#ffffff" stroke="#9b3a34" stroke-width="2"/>
  <text class="t title" x="380" y="169" text-anchor="middle">일시 중지 · 롤백</text>
</svg>
