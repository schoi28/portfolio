<!--
  deploy-rollout-stages · 롤아웃이 단계적으로 확대되는 과정과 단계 사이의 게이트
  사용처: sample_docs/deploy/rollout.md
  쌍: deploy-rollout-stages.en.svg
  기준: _config/diagram-guidelines.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" width="640" height="128"
     role="img"
     aria-label="롤아웃이 1퍼센트에서 100퍼센트까지 단계적으로 확대되는 과정">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="640" height="128" fill="#f5f7f8"/>
  <rect x="24" y="32" width="144" height="72" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="96" y="64" text-anchor="middle">1%</text>
  <text class="t sub" x="96" y="83" text-anchor="middle">1단계</text>
  <path d="M168 68H248" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="180" y="59" width="57" height="18" fill="#f5f7f8"/>
  <text class="t note" x="208" y="72" text-anchor="middle">게이트</text>
  <rect x="248" y="32" width="144" height="72" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="320" y="64" text-anchor="middle">10%</text>
  <text class="t sub" x="320" y="83" text-anchor="middle">2단계</text>
  <path d="M392 68H472" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="404" y="59" width="57" height="18" fill="#f5f7f8"/>
  <text class="t note" x="432" y="72" text-anchor="middle">게이트</text>
  <rect x="472" y="32" width="144" height="72" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="544" y="64" text-anchor="middle">100%</text>
  <text class="t sub" x="544" y="83" text-anchor="middle">3단계</text>
</svg>
