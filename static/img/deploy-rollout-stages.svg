<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="롤아웃이 1퍼센트에서 100퍼센트까지 단계적으로 확대되는 과정">
<rect width="640" height="220" fill="#F7F6F3"/>
<rect x="40" y="60" width="120" height="70" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
<text x="100" y="88" font-family="sans-serif" font-size="14" fill="#0C447C" text-anchor="middle">1단계</text>
<text x="100" y="110" font-family="sans-serif" font-size="18" fill="#0C447C" text-anchor="middle">1%</text>
<rect x="260" y="60" width="120" height="70" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
<text x="320" y="88" font-family="sans-serif" font-size="14" fill="#0C447C" text-anchor="middle">2단계</text>
<text x="320" y="110" font-family="sans-serif" font-size="18" fill="#0C447C" text-anchor="middle">10%</text>
<rect x="480" y="60" width="120" height="70" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="540" y="88" font-family="sans-serif" font-size="14" fill="#0F6E56" text-anchor="middle">3단계</text>
<text x="540" y="110" font-family="sans-serif" font-size="18" fill="#0F6E56" text-anchor="middle">100%</text>
<line x1="160" y1="95" x2="256" y2="95" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="380" y1="95" x2="476" y2="95" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="176" y="20" width="64" height="30" rx="4" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="208" y="40" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle">게이트</text>
<line x1="208" y1="50" x2="208" y2="88" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="396" y="20" width="64" height="30" rx="4" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="428" y="40" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle">게이트</text>
<line x1="428" y1="50" x2="428" y2="88" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="320" y="170" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">각 게이트에서 성공률과 오류율을 판정합니다</text>
<text x="320" y="192" font-family="sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle">기준 미달이면 다음 단계로 넘어가지 않고 자동 일시 중지됩니다</text>
</svg>
