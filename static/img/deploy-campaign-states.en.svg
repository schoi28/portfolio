  <rect width="760" height="352" fill="#f5f7f8"/>
  <rect x="24" y="24" width="280" height="56" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="164" y="57" text-anchor="middle">created</text>
