<!--
  app-update-flow · 소프트웨어 업데이트가 진행되는 상태 흐름
  사용처: sample_docs/app/software-update.md
  쌍: app-update-flow.en.svg
  기준: _config/diagram-guidelines.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 232" width="900" height="232"
     role="img"
     aria-label="업데이트가 진행되는 상태 흐름">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="900" height="232" fill="#f5f7f8"/>
  <rect x="24" y="32" width="148" height="72" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="98" y="73" text-anchor="middle">업데이트 알림</text>
  <rect x="200" y="32" width="148" height="72" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="274" y="64" text-anchor="middle">다운로드</text>
  <text class="t sub" x="274" y="83" text-anchor="middle">주행 중 가능</text>
  <rect x="376" y="32" width="148" height="72" fill="#ffffff" stroke="#9c5f14" stroke-width="2"/>
  <text class="t title" x="450" y="64" text-anchor="middle">설치 대기</text>
  <text class="t sub" x="450" y="83" text-anchor="middle">주차 상태 필요</text>
  <rect x="552" y="32" width="148" height="72" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="626" y="73" text-anchor="middle">설치 중</text>
  <rect x="728" y="32" width="148" height="72" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="802" y="73" text-anchor="middle">완료</text>
  <path d="M172 68H200" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M348 68H376" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M524 68H552" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M700 68H728" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M626 104V152" stroke="#9b3a34" stroke-width="2" marker-end="url(#arrow-danger)" fill="none" stroke-dasharray="6 4"/>
  <rect x="580" y="115" width="92" height="18" fill="#f5f7f8"/>
  <text class="t warn" x="626" y="128" text-anchor="middle">설치 실패 시</text>
  <rect x="552" y="152" width="148" height="56" fill="#ffffff" stroke="#9b3a34" stroke-width="2"/>
  <text class="t title" x="626" y="185" text-anchor="middle">자동 복구</text>
</svg>
