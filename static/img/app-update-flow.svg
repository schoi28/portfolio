<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="소프트웨어 업데이트가 진행되는 상태 흐름">
<rect width="640" height="210" fill="#F7F6F3"/>
<rect x="20" y="40" width="110" height="56" rx="6" fill="#FFFFFF" stroke="#C9C6BD"/>
<text x="75" y="66" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">업데이트</text>
<text x="75" y="83" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">알림</text>
<rect x="152" y="40" width="110" height="56" rx="6" fill="#FFFFFF" stroke="#C9C6BD"/>
<text x="207" y="73" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">다운로드</text>
<rect x="284" y="40" width="110" height="56" rx="6" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="339" y="66" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle">설치 대기</text>
<text x="339" y="83" font-family="sans-serif" font-size="10" fill="#633806" text-anchor="middle">주차 상태 필요</text>
<rect x="416" y="40" width="110" height="56" rx="6" fill="#FFFFFF" stroke="#C9C6BD"/>
<text x="471" y="73" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">설치 중</text>
<rect x="548" y="40" width="72" height="56" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="584" y="73" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">완료</text>
<line x1="130" y1="68" x2="148" y2="68" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="262" y1="68" x2="280" y2="68" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="394" y1="68" x2="412" y2="68" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="526" y1="68" x2="544" y2="68" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="416" y="132" width="110" height="48" rx="6" fill="#FCEBEB" stroke="#E24B4A"/>
<text x="471" y="161" font-family="sans-serif" font-size="12" fill="#791F1F" text-anchor="middle">자동 복구</text>
<line x1="471" y1="96" x2="471" y2="128" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="486" y="118" font-family="sans-serif" font-size="10" fill="#A32D2D">설치 실패 시</text>
<text x="320" y="200" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">다운로드는 주행 중에도 진행되며, 설치만 주차 상태를 요구합니다</text>
</svg>
