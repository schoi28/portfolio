  <rect x="316" y="388" width="184" height="40" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="408" y="413" text-anchor="middle">존 ECU</text>
  <path d="M500 408H532" stroke="#3d4852" stroke-width="2" fill="none"/>
  <rect x="532" y="388" width="184" height="40" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="624" y="413" text-anchor="middle">VELA Sense</text>
