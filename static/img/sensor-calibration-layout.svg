<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="정적 캘리브레이션 시 차량과 타깃 보드의 배치">
  <style>
    .t { font-family: 'Pretendard', -apple-system, sans-serif; fill: #0f1419; }
    .b { font-size: 12px; font-weight: 600; }
    .s { font-size: 10.5px; fill: #6b7681; }
  </style>
  <rect width="700" height="330" fill="#f5f7f8"/>

  <!-- 센서 시야 (기하 영역이므로 화살표가 아니라 면으로 표시) -->
  <path d="M104 165 L560 58 L560 272 Z" fill="#e7ecf1"/>
  <text class="t s" x="300" y="176">센서 시야</text>

  <!-- 차량 (상면도, 전방이 오른쪽) -->
  <path d="M30 118 Q30 106 44 104 L76 100 Q96 70 116 68 L150 68 Q168 72 178 104
           L186 120 Q190 142 190 165 Q190 188 186 210 L178 226 Q168 258 150 262
           L116 262 Q96 260 76 230 L44 226 Q30 224 30 212 Z"
        fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <circle cx="104" cy="165" r="9" fill="#1f3a5f"/>
  <text class="t s" x="104" y="192" text-anchor="middle">센서</text>
  <text class="t b" x="80" y="300" text-anchor="middle">차량</text>
  <text class="t s" x="80" y="316" text-anchor="middle">전방이 오른쪽</text>

  <!-- 타깃 보드 -->
  <g>
    <rect x="540" y="42" width="20" height="36" fill="#0f1419"/><rect x="540" y="42" width="10" height="18" fill="#ffffff"/><rect x="550" y="60" width="10" height="18" fill="#ffffff"/>
    <rect x="538" y="40" width="24" height="40" fill="none" stroke="#0f1419" stroke-width="2"/>
    <text class="t b" x="550" y="32" text-anchor="middle">타깃 A</text>
  </g>
  <g>
    <rect x="540" y="252" width="20" height="36" fill="#0f1419"/><rect x="540" y="252" width="10" height="18" fill="#ffffff"/><rect x="550" y="270" width="10" height="18" fill="#ffffff"/>
    <rect x="538" y="250" width="24" height="40" fill="none" stroke="#0f1419" stroke-width="2"/>
    <text class="t b" x="550" y="308" text-anchor="middle">타깃 B</text>
  </g>
  <g>
    <rect x="640" y="147" width="20" height="36" fill="#0f1419"/><rect x="640" y="147" width="10" height="18" fill="#ffffff"/><rect x="650" y="165" width="10" height="18" fill="#ffffff"/>
    <rect x="638" y="145" width="24" height="40" fill="none" stroke="#0f1419" stroke-width="2"/>
    <text class="t b" x="650" y="137" text-anchor="middle">타깃 C</text>
  </g>

  <!-- 치수선 (직각) -->
  <path d="M104 220V240M550 220V240M104 232H550" stroke="#6b7681" stroke-width="2" fill="none"/>
  <text class="t s" x="327" y="226" text-anchor="middle">3.0 m ± 5 cm</text>
  <path d="M104 100V84M650 128V84M104 92H650" stroke="#6b7681" stroke-width="2" fill="none"/>
  <text class="t s" x="377" y="86" text-anchor="middle">6.0 m ± 5 cm</text>

  <text class="t s" x="30" y="322">바닥은 수평이어야 하며, 기울기 0.5% 이하</text>
</svg>
