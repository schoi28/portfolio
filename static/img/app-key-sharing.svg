<text x="89" y="92" font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">공유 요청</text>
<rect x="180" y="46" width="130" height="66" rx="6" fill="#FFFFFF" stroke="#C9C6BD"/>
