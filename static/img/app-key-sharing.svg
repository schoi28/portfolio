<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="디지털 키 공유가 진행되는 네 단계">
<rect width="640" height="170" fill="#F7F6F3"/>
<rect x="24" y="46" width="130" height="66" rx="6" fill="#FFFFFF" stroke="#C9C6BD"/>
