<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="차량 상면도에서 본 라이다와 카메라 4대의 장착 위치">
<rect width="560" height="340" fill="#F7F6F3"/>
<rect x="190" y="40" width="180" height="270" rx="46" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
<text x="280" y="66" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">전방</text>
<text x="280" y="296" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">후방</text>
<rect x="250" y="150" width="60" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
<text x="280" y="170" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">LR-40</text>
<text x="280" y="185" font-family="sans-serif" font-size="9" fill="#3C3489" text-anchor="middle">라이다</text>
<circle cx="280" cy="86" r="13" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="280" y="90" font-family="sans-serif" font-size="9" fill="#0F6E56" text-anchor="middle">C1</text>
<circle cx="280" cy="266" r="13" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="280" y="270" font-family="sans-serif" font-size="9" fill="#0F6E56" text-anchor="middle">C2</text>
<circle cx="206" cy="176" r="13" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="206" y="180" font-family="sans-serif" font-size="9" fill="#0F6E56" text-anchor="middle">C3</text>
<circle cx="354" cy="176" r="13" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="354" y="180" font-family="sans-serif" font-size="9" fill="#0F6E56" text-anchor="middle">C4</text>
<rect x="238" y="228" width="84" height="30" rx="4" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="280" y="248" font-family="sans-serif" font-size="9" fill="#633806" text-anchor="middle">인터페이스 박스</text>
<text x="392" y="90" font-family="sans-serif" font-size="11" fill="#2C2C2A">C1 전방 카메라</text>
<text x="392" y="112" font-family="sans-serif" font-size="11" fill="#2C2C2A">C2 후방 카메라</text>
<text x="392" y="134" font-family="sans-serif" font-size="11" fill="#2C2C2A">C3 좌측 카메라</text>
<text x="392" y="156" font-family="sans-serif" font-size="11" fill="#2C2C2A">C4 우측 카메라</text>
<text x="392" y="180" font-family="sans-serif" font-size="11" fill="#3C3489">LR-40 루프 중앙</text>
<text x="392" y="202" font-family="sans-serif" font-size="11" fill="#633806">인터페이스 박스 트렁크</text>
<text x="280" y="326" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">치수는 축척이 아니며 상대 위치만 나타냅니다</text>
</svg>
