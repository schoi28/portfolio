    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="760" height="200" fill="#f5f7f8"/>
  <rect x="24" y="32" width="176" height="56" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
