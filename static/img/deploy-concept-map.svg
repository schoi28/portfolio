  <text class="t title" x="472" y="109" text-anchor="middle">단계 1</text>
  <path d="M512 104H544" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="544" y="76" width="80" height="56" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="584" y="109" text-anchor="middle">단계 2</text>
  <path d="M624 104H656" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
