  <rect x="256" y="76" width="144" height="56" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="328" y="109" text-anchor="middle">캠페인</text>
  <path d="M400 104H432" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
