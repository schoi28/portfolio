<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488"
     role="img"
     aria-label="VELA Cloud와 차량, 모바일 앱의 연결 구조">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="900" height="488" fill="#f5f7f8"/>
  <rect x="24" y="24" width="852" height="168" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t zone" x="44" y="49" text-anchor="start">VELA CLOUD</text>
  <text class="t sub" x="164" y="49" text-anchor="start">VELA가 운영하는 서버</text>
  <rect x="44" y="64" width="248" height="56" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="168" y="90" text-anchor="middle">VELA Deploy</text>
  <text class="t sub" x="168" y="109" text-anchor="middle">무선 업데이트 배포 콘솔</text>
  <text class="t reader" x="168" y="146" text-anchor="middle">▲ 릴리스 운영자</text>
  <text class="t sub" x="168" y="165" text-anchor="middle">배포 범위를 결정</text>
  <rect x="326" y="64" width="248" height="56" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="450" y="90" text-anchor="middle">Vehicle API</text>
  <text class="t sub" x="450" y="109" text-anchor="middle">차량 데이터 · 제어</text>
  <text class="t reader" x="450" y="146" text-anchor="middle">▲ 개발자</text>
  <text class="t sub" x="450" y="165" text-anchor="middle">위에서 기능을 개발</text>
  <rect x="608" y="64" width="248" height="56" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="732" y="90" text-anchor="middle">Drive 백엔드</text>
  <text class="t sub" x="732" y="109" text-anchor="middle">앱 연동</text>
  <path d="M168 192V256" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="114" y="215" width="107" height="18" fill="#f5f7f8"/>
  <text class="t note" x="168" y="228" text-anchor="middle">소프트웨어 배포</text>
  <path d="M442 256V192" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="399" y="215" width="85" height="18" fill="#f5f7f8"/>
  <text class="t note" x="442" y="228" text-anchor="middle">차량 데이터</text>
  <rect x="24" y="256" width="560" height="168" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t zone" x="44" y="281" text-anchor="start">차량</text>
  <rect x="44" y="296" width="244" height="56" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="166" y="322" text-anchor="middle">차량 소프트웨어 플랫폼</text>
  <text class="t sub" x="166" y="341" text-anchor="middle">주행 기능 실행</text>
  <rect x="320" y="296" width="244" height="56" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="442" y="322" text-anchor="middle">VELA Sense 센서 킷</text>
  <text class="t sub" x="442" y="341" text-anchor="middle">개발 · 검증 차량용</text>
  <text class="t reader" x="442" y="378" text-anchor="middle">▼ 현장 엔지니어</text>
  <text class="t sub" x="442" y="397" text-anchor="middle">장착하고 보정</text>
  <path d="M732 192V296" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="608" y="296" width="248" height="56" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="732" y="322" text-anchor="middle">VELA Drive 앱</text>
  <text class="t sub" x="732" y="341" text-anchor="middle">차량 관리 모바일 앱</text>
  <text class="t reader" x="732" y="378" text-anchor="middle">▲ 차량 소유자</text>
  <text class="t sub" x="732" y="397" text-anchor="middle">내 차 상태를 확인</text>
  <rect x="236" y="448" width="12" height="12" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t lgnd" x="256" y="458" text-anchor="start">문서 세트가 다루는 제품</text>
  <rect x="401" y="448" width="12" height="12" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t lgnd" x="421" y="458" text-anchor="start">배경 구성 요소</text>
  <text class="t reader" x="539" y="459" text-anchor="middle">▲</text>
  <text class="t lgnd" x="553" y="458" text-anchor="start">그 문서를 읽는 사람</text>
</svg>
