<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556"
     role="img" aria-label="VELA Cloud와 차량, 모바일 앱의 연결 구조와 각 지점을 읽는 독자">
  <style>
    .lbl { font-family: 'Pretendard', -apple-system, sans-serif; fill: #0f1419; }
    .zone { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
    .zone-sub { font-size: 12.5px; fill: #6b7681; }
    .box { font-size: 15px; font-weight: 600; }
    .box-sub { font-size: 12px; fill: #6b7681; }
    .edge { font-size: 12.5px; fill: #3d4852; }
    .reader { font-size: 12.5px; font-weight: 600; fill: #1f3a5f; }
  </style>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#3d4852"/>
    </marker>
  </defs>

  <rect width="1200" height="556" fill="#f5f7f8"/>

  <!-- ───── VELA Cloud ───── -->
  <rect x="50" y="48" width="720" height="186" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="lbl zone" x="74" y="80">VELA Cloud</text>
  <text class="lbl zone-sub" x="196" y="80">VELA가 운영하는 서버</text>

  <rect x="78" y="100" width="200" height="58" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="lbl box" x="178" y="126" text-anchor="middle">VELA Deploy</text>
  <text class="lbl box-sub" x="178" y="145" text-anchor="middle">무선 업데이트 배포 콘솔</text>
  <text class="lbl reader" x="178" y="186" text-anchor="middle">▲ 릴리스 운영자</text>
  <text class="lbl box-sub" x="178" y="206" text-anchor="middle">배포 범위를 결정</text>

  <rect x="306" y="100" width="200" height="58" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="lbl box" x="406" y="126" text-anchor="middle">Vehicle API</text>
  <text class="lbl box-sub" x="406" y="145" text-anchor="middle">차량 데이터·제어 인터페이스</text>
  <text class="lbl reader" x="406" y="186" text-anchor="middle">▲ 개발자</text>
  <text class="lbl box-sub" x="406" y="206" text-anchor="middle">위에서 기능을 개발</text>

  <rect x="534" y="100" width="200" height="58" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="lbl box" x="634" y="126" text-anchor="middle">Drive 백엔드</text>
  <text class="lbl box-sub" x="634" y="145" text-anchor="middle">앱 연동</text>

  <!-- ───── 차량 ───── -->
  <rect x="50" y="330" width="720" height="186" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="lbl zone" x="74" y="362">차량</text>

  <rect x="78" y="382" width="290" height="58" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="lbl box" x="223" y="408" text-anchor="middle">차량 소프트웨어 플랫폼</text>
  <text class="lbl box-sub" x="223" y="427" text-anchor="middle">주행 기능이 실행되는 층</text>

  <rect x="396" y="382" width="338" height="58" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="lbl box" x="565" y="408" text-anchor="middle">VELA Sense 센서 킷</text>
  <text class="lbl box-sub" x="565" y="427" text-anchor="middle">개발·검증 차량에 장착하는 하드웨어</text>
  <text class="lbl reader" x="565" y="468" text-anchor="middle">▼ 현장 엔지니어</text>
  <text class="lbl box-sub" x="565" y="488" text-anchor="middle">차량에 장착하고 보정</text>

  <!-- ───── 클라우드 ↔ 차량 ───── -->
  <path d="M223 234V330" stroke="#3d4852" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <text class="lbl edge" x="235" y="276">소프트웨어 배포</text>
  <path d="M565 330V234" stroke="#3d4852" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <text class="lbl edge" x="577" y="300">차량 데이터</text>

  <!-- ───── 모바일 앱 ───── -->
  <path d="M770 129H880" stroke="#3d4852" stroke-width="2" fill="none"/>
  <path d="M880 129V382" stroke="#3d4852" stroke-width="2" fill="none"/>
  <path d="M880 382H926" stroke="#3d4852" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <rect x="930" y="353" width="214" height="58" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="lbl box" x="1037" y="379" text-anchor="middle">VELA Drive 앱</text>
  <text class="lbl box-sub" x="1037" y="398" text-anchor="middle">차량 관리 모바일 앱</text>
  <text class="lbl reader" x="1037" y="439" text-anchor="middle">▲ 차량 소유자</text>
  <text class="lbl box-sub" x="1037" y="459" text-anchor="middle">내 차 상태를 확인</text>

  <!-- 범례 -->
  <rect x="930" y="100" width="214" height="134" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="lbl box" x="952" y="128">문서가 있는 지점</text>
  <rect x="952" y="146" width="22" height="14" fill="#f5f7f8" stroke="#1f3a5f" stroke-width="2"/>
  <text class="lbl box-sub" x="986" y="158">문서 세트가 다루는 제품</text>
  <rect x="952" y="176" width="22" height="14" fill="#f5f7f8" stroke="#b9c0c8" stroke-width="2"/>
  <text class="lbl box-sub" x="986" y="188">배경 구성 요소</text>
  <text class="lbl reader" x="952" y="216">▲ 그 문서를 읽는 사람</text>

  <rect x="0" y="576" width="1200" height="4" fill="#0f1419"/>
</svg>
