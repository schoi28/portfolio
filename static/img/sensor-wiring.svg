<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" aria-label="센서와 인터페이스 박스, 중앙 연산 장치의 배선 구성">
  <style>
    .t { font-family: 'Pretendard', -apple-system, sans-serif; fill: #0f1419; }
    .b { font-size: 12.5px; font-weight: 600; }
    .s { font-size: 10.5px; fill: #6b7681; }
    .e { font-size: 10.5px; fill: #3d4852; }
    .a { font-size: 10.5px; font-weight: 700; fill: #9b3a34; }
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0 0L8 4L0 8z" fill="#3d4852"/></marker>
    <marker id="mr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
