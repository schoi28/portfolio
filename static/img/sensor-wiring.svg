  <rect x="40" y="188" width="160" height="48" fill="#f6eded" stroke="#9b3a34" stroke-width="2"/>
  <text class="t b" x="120" y="210" text-anchor="middle">차량 12V</text>
  <text class="t s" x="120" y="226" text-anchor="middle">15 A 퓨즈</text>

  <rect x="300" y="86" width="180" height="96" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
