<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img"
     aria-label="The whole flow from uploading a package to finishing a deployment">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="760" height="328" fill="#f5f7f8"/>
  <rect x="24" y="24" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="101" y="52" text-anchor="middle">Package</text>
  <text class="t sub" x="101" y="71" text-anchor="middle">Upload</text>
  <path d="M178 56H210" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="210" y="24" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="287" y="52" text-anchor="middle">Compatibility</text>
  <text class="t sub" x="287" y="71" text-anchor="middle">Rules</text>
  <path d="M364 56H396" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="396" y="24" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="473" y="52" text-anchor="middle">Target group</text>
  <text class="t sub" x="473" y="71" text-anchor="middle">Create</text>
  <path d="M550 56H582" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="582" y="24" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="659" y="52" text-anchor="middle">Campaign</text>
  <text class="t sub" x="659" y="71" text-anchor="middle">Create</text>
  <path d="M659 88V112H101V136" fill="none" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="24" y="136" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="101" y="173" text-anchor="middle">Stage 1 rollout</text>
  <path d="M178 168H210" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="210" y="136" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="287" y="173" text-anchor="middle">Gate check</text>
  <path d="M364 168H396" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="396" y="136" width="154" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="473" y="173" text-anchor="middle">Stage 2 rollout</text>
  <path d="M550 168H582" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="582" y="136" width="154" height="64" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="659" y="173" text-anchor="middle">Done</text>
  <path d="M287 200V248" stroke="#9b3a34" stroke-width="2" marker-end="url(#arrow-danger)" fill="none" stroke-dasharray="6 4"/>
  <rect x="227" y="215" width="120" height="18" fill="#f5f7f8"/>
  <text class="t warn" x="287" y="228" text-anchor="middle">Below threshold</text>
  <rect x="210" y="248" width="154" height="56" fill="#ffffff" stroke="#9b3a34" stroke-width="2"/>
  <text class="t title" x="287" y="281" text-anchor="middle">Pause · Rollback</text>
</svg>
