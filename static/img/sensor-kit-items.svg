<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     role="img" aria-label="VELA Sense kit items, numbered 1 to 10">
  <style>
    .card { fill: #ffffff; stroke: #b9c0c8; stroke-width: 2; }
    .part { fill: #e4e9ec; stroke: #3d4852; stroke-width: 1.6; }
    .partd { fill: #cdd5da; stroke: #3d4852; stroke-width: 1.6; }
    .wire { fill: none; stroke: #3d4852; stroke-width: 2.2; stroke-linecap: round; }
    .badge { fill: #1f3a5f; }
    .num { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 14px;
           font-weight: 700; fill: #ffffff; }
    .qty { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 12px;
           font-weight: 700; fill: #3d4852; }
  </style>

  <rect width="900" height="400" fill="#f5f7f8"/>

  <!-- 1. LiDAR module -->
  <rect class="card" x="24" y="24" width="160" height="160"/>
  <ellipse class="part" cx="104" cy="88" rx="44" ry="14"/>
  <path class="part" d="M60 88v40a44 14 0 0 0 88 0V88"/>
  <ellipse class="partd" cx="104" cy="128" rx="44" ry="14"/>
  <rect class="partd" x="76" y="96" width="56" height="18" rx="2"/>
  <circle class="badge" cx="44" cy="44" r="13"/>
  <text class="num" x="44" y="49" text-anchor="middle">1</text>

  <!-- 2. Camera modules x4 -->
  <rect class="card" x="196" y="24" width="160" height="160"/>
  <g>
    <rect class="part" x="226" y="78" width="40" height="30" rx="4"/>
    <circle class="partd" cx="246" cy="93" r="8"/>
    <rect class="part" x="286" y="78" width="40" height="30" rx="4"/>
    <circle class="partd" cx="306" cy="93" r="8"/>
    <rect class="part" x="226" y="122" width="40" height="30" rx="4"/>
    <circle class="partd" cx="246" cy="137" r="8"/>
    <rect class="part" x="286" y="122" width="40" height="30" rx="4"/>
    <circle class="partd" cx="306" cy="137" r="8"/>
  </g>
  <text class="qty" x="336" y="172" text-anchor="end">× 4</text>
  <circle class="badge" cx="216" cy="44" r="13"/>
  <text class="num" x="216" y="49" text-anchor="middle">2</text>

  <!-- 3. Interface box -->
  <rect class="card" x="368" y="24" width="160" height="160"/>
  <rect class="part" x="398" y="80" width="100" height="56" rx="3"/>
  <rect class="partd" x="408" y="94" width="14" height="12" rx="2"/>
  <rect class="partd" x="428" y="94" width="14" height="12" rx="2"/>
  <rect class="partd" x="448" y="94" width="14" height="12" rx="2"/>
  <rect class="partd" x="468" y="94" width="14" height="12" rx="2"/>
  <rect class="partd" x="408" y="114" width="34" height="12" rx="2"/>
  <rect class="partd" x="448" y="114" width="34" height="12" rx="2"/>
  <circle class="badge" cx="388" cy="44" r="13"/>
  <text class="num" x="388" y="49" text-anchor="middle">3</text>

  <!-- 4. LiDAR ethernet cable -->
  <rect class="card" x="540" y="24" width="160" height="160"/>
  <path class="wire" d="M566 86c34 0 34 24 68 24s34 24 68 24"/>
  <rect class="partd" x="558" y="80" width="14" height="12" rx="2"/>
  <rect class="partd" x="690" y="128" width="14" height="12" rx="2"/>
  <text class="qty" x="680" y="172" text-anchor="end">6.0 m</text>
  <circle class="badge" cx="560" cy="44" r="13"/>
  <text class="num" x="560" y="49" text-anchor="middle">4</text>

  <!-- 5. Camera coaxial cables x4 -->
  <rect class="card" x="712" y="24" width="160" height="160"/>
  <path class="wire" d="M738 84c28 0 28 14 56 14s28 14 56 14"/>
  <path class="wire" d="M738 110c28 0 28 14 56 14s28 14 56 14"/>
  <path class="wire" d="M738 136c28 0 28 10 56 10s28 10 56 10"/>
  <text class="qty" x="852" y="172" text-anchor="end">× 4</text>
  <circle class="badge" cx="732" cy="44" r="13"/>
  <text class="num" x="732" y="49" text-anchor="middle">5</text>

  <!-- 6. Power harness -->
  <rect class="card" x="24" y="212" width="160" height="160"/>
  <path class="wire" d="M50 274c30 0 30 20 60 20s30 20 60 20"/>
  <rect class="part" x="86" y="292" width="26" height="16" rx="3"/>
  <rect class="partd" x="42" y="268" width="14" height="12" rx="2"/>
  <text class="qty" x="164" y="360" text-anchor="end">2.5 m</text>
  <circle class="badge" cx="44" cy="232" r="13"/>
  <text class="num" x="44" y="237" text-anchor="middle">6</text>

  <!-- 7. Output ethernet cable -->
  <rect class="card" x="196" y="212" width="160" height="160"/>
  <path class="wire" d="M224 286c28 0 28 18 56 18s28 18 48 18"/>
  <rect class="partd" x="216" y="280" width="14" height="12" rx="2"/>
  <rect class="partd" x="326" y="316" width="14" height="12" rx="2"/>
  <text class="qty" x="336" y="360" text-anchor="end">2.0 m</text>
  <circle class="badge" cx="216" cy="232" r="13"/>
  <text class="num" x="216" y="237" text-anchor="middle">7</text>

  <!-- 8. Bracket set -->
  <rect class="card" x="368" y="212" width="160" height="160"/>
  <path class="part" d="M396 300h44v-28h16v44h-60z"/>
  <path class="part" d="M470 272h34v16h-18v28h-16z"/>
  <circle class="partd" cx="404" cy="292" r="4"/>
  <circle class="partd" cx="432" cy="292" r="4"/>
  <circle class="badge" cx="388" cy="232" r="13"/>
  <text class="num" x="388" y="237" text-anchor="middle">8</text>

  <!-- 9. Sealant -->
  <rect class="card" x="540" y="212" width="160" height="160"/>
  <path class="part" d="M606 266h28v54h-28z"/>
  <path class="partd" d="M612 266l8-20h8l4 20z"/>
  <rect class="partd" x="616" y="240" width="10" height="10" rx="2"/>
  <text class="qty" x="680" y="360" text-anchor="end">80 ml</text>
  <circle class="badge" cx="560" cy="232" r="13"/>
  <text class="num" x="560" y="237" text-anchor="middle">9</text>

  <!-- 10. Calibration target boards x3 -->
  <rect class="card" x="712" y="212" width="160" height="160"/>
  <g>
    <rect class="part" x="746" y="258" width="44" height="44"/>
    <rect class="partd" x="746" y="258" width="22" height="22"/>
    <rect class="partd" x="768" y="280" width="22" height="22"/>
    <rect class="part" x="796" y="276" width="34" height="34"/>
    <rect class="partd" x="796" y="276" width="17" height="17"/>
    <rect class="partd" x="813" y="293" width="17" height="17"/>
  </g>
  <text class="qty" x="852" y="360" text-anchor="end">× 3</text>
  <circle class="badge" cx="732" cy="232" r="13"/>
  <text class="num" x="732" y="237" text-anchor="middle">10</text>
</svg>
