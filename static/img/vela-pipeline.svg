<!--
  vela-pipeline · 문서를 푸시하면 검수를 먼저 돌리고 오류가 없을 때만 배포하는 과정
  사용처: projects/vela.md
  쌍: vela-pipeline.en.svg
  기준: _config/diagram-guidelines.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376"
     role="img"
     aria-label="문서를 고쳐 푸시하면 GitHub Actions가 검수를 먼저 돌리고, 오류가 없을 때만 빌드해 배포하는 과정">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="900" height="376" fill="#f5f7f8"/>
  <rect x="24" y="24" width="200" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="124" y="52" text-anchor="middle">문서를 고친다</text>
  <text class="t sub" x="124" y="71" text-anchor="middle">sample_docs/ · _config/</text>
  <path d="M224 56H256" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="256" y="24" width="200" height="64" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="356" y="52" text-anchor="middle">git push</text>
  <text class="t sub" x="356" y="71" text-anchor="middle">main 브랜치</text>
  <path d="M356 88V116H109V144" fill="none" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="107" width="125" height="18" fill="#f5f7f8"/>
  <text class="t note" x="232" y="120" text-anchor="middle">푸시하면 자동 실행</text>
  <rect x="24" y="144" width="170" height="88" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="109" y="172" text-anchor="middle">환경 준비</text>
  <text class="t sub" x="109" y="191" text-anchor="middle">소스 내려받기</text>
  <text class="t sub" x="109" y="210" text-anchor="middle">Node 20 · npm ci</text>
  <rect x="226" y="144" width="170" height="88" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="311" y="172" text-anchor="middle">문서 검수</text>
  <text class="t sub" x="311" y="191" text-anchor="middle">npm run check</text>
  <text class="t sub" x="311" y="210" text-anchor="middle">설정 기준 88편 검사</text>
  <rect x="504" y="144" width="170" height="88" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <text class="t title" x="589" y="172" text-anchor="middle">사이트 빌드</text>
  <text class="t sub" x="589" y="191" text-anchor="middle">국문 · 영문</text>
  <text class="t sub" x="589" y="210" text-anchor="middle">정적 HTML 생성</text>
  <rect x="706" y="144" width="170" height="88" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="791" y="172" text-anchor="middle">배포</text>
  <text class="t sub" x="791" y="191" text-anchor="middle">GitHub Pages</text>
  <text class="t sub" x="791" y="210" text-anchor="middle"></text>
  <path d="M194 188H226" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M396 188H504" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="415" y="179" width="70" height="18" fill="#f5f7f8"/>
  <text class="t note" x="450" y="192" text-anchor="middle">오류 0건</text>
  <path d="M674 188H706" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M311 232V288" stroke="#9b3a34" stroke-width="2" marker-end="url(#arrow-danger)" fill="none" stroke-dasharray="6 4"/>
  <rect x="262" y="251" width="98" height="18" fill="#f5f7f8"/>
  <text class="t warn" x="311" y="264" text-anchor="middle">오류 1건 이상</text>
  <rect x="226" y="288" width="170" height="64" fill="#ffffff" stroke="#9b3a34" stroke-width="2"/>
  <text class="t title" x="311" y="316" text-anchor="middle">배포 중단</text>
  <text class="t sub" x="311" y="335" text-anchor="middle">사이트는 이전 상태 유지</text>
  <path d="M791 232V288" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="706" y="288" width="170" height="64" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text class="t title" x="791" y="316" text-anchor="middle">공개</text>
  <text class="t sub" x="791" y="335" text-anchor="middle">바뀐 문서가 반영됨</text>
</svg>
