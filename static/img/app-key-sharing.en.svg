<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 144" width="640" height="144"
     role="img"
     aria-label="The four stages of sharing a key">
  <style>
    .t { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .zone  { font-size: 14px; font-weight: 700; fill: #0f1419; letter-spacing: 0.04em; }
    .title { font-size: 13px; font-weight: 600; fill: #0f1419; }
    .sub   { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .note  { font-size: 11px; font-weight: 700; fill: #3d4852; }
    .warn  { font-size: 11px; font-weight: 700; fill: #9b3a34; }
    .boxw  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .idx   { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lgnd  { font-size: 11px; font-weight: 400; fill: #6b7681; }
    .reader{ font-size: 11px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3d4852"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9b3a34"/>
    </marker>
  </defs>

  <rect width="640" height="144" fill="#f5f7f8"/>
  <rect x="24" y="40" width="130" height="80" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <circle cx="89" cy="64" r="13" fill="#3d4852"/>
  <text class="t idx" x="89" y="68" text-anchor="middle">1</text>
  <text class="t title" x="89" y="96" text-anchor="middle">Request sent</text>
  <text class="t sub" x="89" y="112" text-anchor="middle">By the owner</text>
  <rect x="178" y="40" width="130" height="80" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <circle cx="243" cy="64" r="13" fill="#3d4852"/>
  <text class="t idx" x="243" y="68" text-anchor="middle">2</text>
  <text class="t title" x="243" y="96" text-anchor="middle">Invitation email</text>
  <text class="t sub" x="243" y="112" text-anchor="middle">Valid for 72 hours</text>
  <rect x="332" y="40" width="130" height="80" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/>
  <circle cx="397" cy="64" r="13" fill="#3d4852"/>
  <text class="t idx" x="397" y="68" text-anchor="middle">3</text>
  <text class="t title" x="397" y="96" text-anchor="middle">Accepted</text>
  <text class="t sub" x="397" y="112" text-anchor="middle">In the app</text>
  <rect x="486" y="40" width="130" height="80" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <circle cx="551" cy="64" r="13" fill="#1f3a5f"/>
  <text class="t idx" x="551" y="68" text-anchor="middle">4</text>
  <text class="t title" x="551" y="96" text-anchor="middle">Key active</text>
  <text class="t sub" x="551" y="112" text-anchor="middle">Ready to use</text>
  <path d="M154 80H178" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M308 80H332" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M462 80H486" stroke="#3d4852" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
</svg>
