<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="시간축 위에 쌓인 경력 기록">
  <defs>
    <pattern id="g-resume" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#dfe3e8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="#f5f7f8"/>
  <rect width="1600" height="400" fill="url(#g-resume)"/>

  <!-- 시간축 -->
  <path d="M120 340H1480" stroke="#0f1419" stroke-width="2"/>
  <g stroke="#b9c0c8" stroke-width="2">
    <path d="M280 340v14M440 340v14M600 340v14M760 340v14M920 340v14M1080 340v14M1240 340v14"/>
  </g>

  <!-- 경력 구간 두 개. 아래가 먼 과거, 위가 현재 -->
  <rect x="280" y="252" width="440" height="36" fill="#b9c0c8"/>
  <rect x="720" y="196" width="640" height="36" fill="#1f3a5f"/>

  <!-- 구간과 축을 잇는 수직선 -->
  <g stroke="#b9c0c8" stroke-width="1.5">
    <path d="M280 288v52M720 288v52"/>
  </g>
  <g stroke="#1f3a5f" stroke-width="1.5">
    <path d="M720 232v108M1360 232v108"/>
  </g>

  <!-- 각 구간이 남긴 기록 -->
  <g stroke="#b9c0c8" stroke-width="2">
    <path d="M280 152H640M280 124H520M280 96H580"/>
  </g>
  <g stroke="#b9c0c8" stroke-width="2">
    <path d="M760 152H1200M760 124H1040M760 96H1320"/>
  </g>

  <rect x="0" y="396" width="1600" height="4" fill="#0f1419"/>
</svg>
