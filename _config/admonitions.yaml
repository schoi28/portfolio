# 경고 등급 체계
# 등급을 남용하면 독자가 전부 무시한다. 아래 기준에 맞을 때만 사용한다.
# Docusaurus의 :::danger / :::warning / :::caution / :::note 에 대응한다.

levels:
  danger:
    label_ko: 위험
    label_en: Danger
    criterion: 지키지 않으면 사람이 다칠 수 있다.
    used_in: [HW]
    examples:
      - 라이다 창을 들여다보지 마십시오. 시력이 손상될 수 있습니다.
      - 전원이 인가된 상태에서 커넥터를 분리하지 마십시오.
    rule: 해당 작업 단계 바로 앞에 배치한다. 문서 앞에 몰아 쓰지 않는다.

  warning:
    label_ko: 경고
    label_en: Warning
    criterion: 지키지 않으면 장비가 손상되거나 되돌릴 수 없다.
    used_in: [HW, B2B, B2C]
    examples:
      - 롤백은 이미 설치를 완료한 차량에는 적용되지 않습니다.
      - 업데이트 중 시동을 끄면 설치가 중단됩니다.
    rule: 되돌릴 수 없는 동작에는 반드시 붙인다.

  caution:
    label_ko: 주의
    label_en: Caution
    criterion: 지키지 않으면 작업이 실패하거나 결과가 부정확해진다.
    used_in: [HW, B2B, API]
    examples:
      - 타깃 보드가 기울면 캘리브레이션 결과가 부정확해집니다.
      - 토큰 만료 전에 갱신하지 않으면 진행 중인 요청이 실패합니다.

  note:
    label_ko: 참고
    label_en: Note
    criterion: 알아두면 좋지만 몰라도 작업은 끝난다.
    used_in: [전체]
    rule: 한 페이지에 3개를 넘기지 않는다. 넘으면 본문으로 옮긴다.

# 세트별 사용 비중 (설계 의도)
usage_by_doc_set:
  B2C: 경고와 참고 위주. 위험은 쓰지 않는다. 사용자는 하드웨어를 직접 만지지 않는다.
  B2B: 경고와 주의 위주. 배포는 되돌리기 어려운 동작이 많다.
  API: 주의 위주. 개발자는 재시도할 수 있으므로 강한 등급이 필요 없다.
  HW: 네 등급 모두 사용. 유일하게 신체 위험이 있는 문서다.
