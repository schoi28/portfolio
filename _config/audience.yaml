# 독자 정의
# 문서를 쓰기 전에 이 파일에서 독자를 먼저 고른다.
# 정보 설계 판단의 근거이자, AI 리뷰 agent가 참조하는 기준이다.

audiences:
  owner:
    label: 차량 소유자
    doc_set: VELA Drive 앱 사용 설명서
    prior_knowledge: 없음. 자동차 정비 지식도, 소프트웨어 지식도 가정하지 않는다.
    reading_context: 휴대폰 화면. 차 앞에 서서, 대체로 급한 상황.
    goal: 지금 당장 하려는 동작 하나를 끝낸다.
    writing_rules:
      - 한 절에 한 작업만 담는다.
      - 절차는 5단계를 넘기지 않는다. 넘으면 절을 나눈다.
      - 전문 용어를 쓰지 않는다. OTA, 시그널, 프로비저닝 같은 말은 금지.
      - 실패할 수 있는 동작은 사전 조건을 절차 앞에 먼저 쓴다.
      - 스크린샷 없이도 이해되게 쓴다. 화면 요소는 이름으로 지칭한다.

  operator:
    label: 릴리스 운영자
    doc_set: VELA Deploy 운영 가이드
    prior_knowledge: 업무 도구에 익숙하다. 코드는 읽지 못한다. 차량 소프트웨어 릴리스 절차는 안다.
    reading_context: 데스크톱. 배포 중이거나, 사고가 나서 급히 찾아본 상황.
    goal: 판단을 내린다. 계속 진행할지, 멈출지, 되돌릴지.
    writing_rules:
      - 개념 설명과 절차를 섞지 않는다. 개념은 1장에 모은다.
      - 문제 대응 장은 앞을 읽지 않아도 이해되게 독립적으로 쓴다.
      - 판단 기준은 표로 제시한다. 서술로 풀면 급할 때 읽히지 않는다.
      - 되돌릴 수 없는 동작에는 경고를 단다.
      - 숫자 기준(성공률, 오류율)은 예시값과 함께 제시하되 예시임을 명시한다.

  developer:
    label: OEM · 협력사 개발자
    doc_set: VELA Vehicle API · SDK
    prior_knowledge: 높음. REST, OAuth, 인증서를 안다. 다만 VELA 제품은 처음이다.
    reading_context: IDE 옆 브라우저. 검색해서 필요한 항목만 본다.
    goal: 지금 작성 중인 코드를 동작시킨다.
    writing_rules:
      - 각 항목이 독립적으로 이해되게 쓴다. 순서대로 읽는 문서가 아니다.
      - 모든 요청 예시에 실행 가능한 코드와 실제 응답을 함께 싣는다.
      - 파라미터는 이름만 쓰지 않는다. 의미, 형식, 예시를 함께 쓴다.
      - 실패 응답을 성공 응답과 같은 비중으로 다룬다.
      - 제품 개념은 리소스 모델 표 하나로 정리하고 반복하지 않는다.

  field_engineer:
    label: 현장 엔지니어
    doc_set: VELA Sense 센서 킷 설치 가이드
    prior_knowledge: 하드웨어 작업에 숙련. 소프트웨어와 네트워크 지식은 낮다.
    reading_context: 작업 현장. 태블릿. 장갑을 낀 손. 조명이 나쁠 수 있다.
    goal: 작업을 안전하게, 규격대로 끝낸다.
    writing_rules:
      - 한 화면에 한 작업 단위가 들어가게 절을 잘게 나눈다.
      - 표와 그림 위주로 쓴다. 긴 문단을 만들지 않는다.
      - 안전 경고는 해당 작업 바로 앞에 반복해서 배치한다. 문서 앞에 몰아 쓰지 않는다.
      - 수치에는 항상 단위와 허용 오차를 함께 쓴다.
      - 소프트웨어 용어가 필요하면 그 자리에서 한 줄로 설명한다.

# 한 문서를 쓰기 전 반드시 답할 세 가지
before_writing:
  - 독자는 위 넷 중 누구인가
  - 이 문서로 독자가 해결하는 문제는 무엇인가
  - 개념 이해용인가, 작업 수행용인가, 검색용 레퍼런스인가
